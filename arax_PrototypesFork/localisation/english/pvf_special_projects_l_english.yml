l_english:
 sp_praying_mantis_tank:0 "Praying Mantis"
 sp_praying_mantis_tank_desc:0 "An experimental armoured vehicle designed to fire over cover and obstacles using an elevating turret."
 sp_modra_tank:0 "Modra Revolving Tank"
 sp_modra_tank_desc:0 "A concept for a revolving armored hull, intended to deflect enemy fire by rolling its dome-shaped body across the battlefield."
 sp_helicopter_tank:0 ""Grasshopper" Helicopter Tank"
 sp_helicopter_tank_desc:0 "A tank fitted with helicopter-style rotors, designed to leap over obstacles and traverse difficult terrain with ease."
 sp_mk6_tank:0 "Mk-VI 47mm"
 sp_mk6_tank_desc:0 "A tiny tankette experimentally fitted with a powerful 47 mm FRC anti-tank gun, intended to provide mobile firepower against enemy armored vehicles while retaining the compact size and mobility of the original chassis."
 sp_oqf_tank:0 "OQF 3.7'' AA on Ram Mounting"
 sp_oqf_tank_desc:0 "A heavy anti-aircraft gun that can deliver accurate, high-altitude fire and may prove highly effective in its defensive role."
 sp_centaur_tank:0 "Centaur FV4005"
 sp_centaur_tank_desc:0 "An experimental tank destroyer built on a Centurion chassis, notable for mounting the gigantic 183 mm L4 gun—the largest tank gun ever fitted to a vehicle—giving it unprecedented single-shot firepower."
 sp_amx_tank:0 "AMX Tank Destroyer"
 sp_amx_tank_desc:0 "A fast and lightly armored tank destroyer, it combines high mobility with a powerful 90 mm gun, giving it the ability to outmaneuver enemies while delivering strong anti-tank firepower."
 sp_fcm_tank:0 "FCM 12t"
 sp_fcm_tank_desc:0 "A compact light tank that can field a powerful 90 mm gun in an oscillating turret, while maintaining high speed and mobility thanks to its lightweight design and special torsion suspension that improves stability and handling."
 sp_pak_tank:0 "Steyr PaK 43 Waffenträger"
 sp_pak_tank_desc:0 "A lightweight carrier vehicle mounting the powerful 88 mm PaK 43 gun to provide mobile heavy anti-tank firepower."
 sp_flak_tank:0 "Flakpanzer 341"
 sp_flak_tank_desc:0 "A medium tank chassis fitted with a twin 37 mm autocannon turret, built to provide powerful mobile anti-aircraft defense for armored units."
 sp_t52_tank:0 "T52 Multiple Gun Motor Carriage"
 sp_t52_tank_desc:0 "A lightly armored tank with a special turret mounting a 37 mm autocannon and twin .50 caliber machine guns to provide extraordinary mobile anti-aircraft firepower."
 sp_smk_tank:0 "SMK Heavy Tank"
 sp_smk_tank_desc:0 "A massive multi-turreted heavy tank that combines thick armor with the ability to engage different targets simultaneously."
 sp_soto_tank:0 "So-To Anti Tank Gun Carrier"
 sp_soto_tank_desc:0 "A tiny tracked vehicle that carries a gun on an exposed mount, offering mobile firepower in the simplest possible form with small fuel consumption."
 sp_stg_tank:0 "Gremyakin STG"
 sp_stg_tank_desc:0 "A medium tank with a rear-mounted turret and sloped frontal armor, designed to combine heavy firepower with strong protection in an unconventional layout."
 sp_mtls_tank:0 "Marmon-Herrington MTLS-1G14"
 sp_mtls_tank_desc:0 "A medium tank that delivers rapid firepower and excels at engaging softer targets with overwhelming volume of fire."
 sp_yoh_tank:0 "M-V-Yoh"
 sp_yoh_tank_desc:0 "A bold experimental design that brings together unconventional ideas to push the limits of what a modern battle tank could be."
 sp_giacomini_tank:0 "Giacomini Entrenchment Tank"
 sp_giacomini_tank_desc:0 "A vehicle designed to dig trenches and prepare battlefield defenses, using a modified tank chassis equipped with specialized earth-moving equipment instead of a main gun."
 sp_t43_tank:0 "T43E1"
 sp_t43_tank_desc:0 "A heavy tank fitted with an exceptionally powerful gun and thick frontal armor, made unique by the addition of a front-mounted dozer blade for battlefield engineering tasks."
 sp_alecto_tank:0 "Alecto SPG"
 sp_alecto_tank_desc:0 "A light self-propelled gun designed for speed and mobility, providing effective fire support to airborne and infantry units."
 sp_t82_tank:0 "T82 Howitzer Motor Carriage"
 sp_t82_tank_desc:0 "A light self-propelled gun mounting a 105 mm howitzer on a Stuart chassis, built to provide fast and mobile fire support."
 sp_m5_tank:0 "M5/T1 Tank Destroyer"
 sp_m5_tank_desc:0 "An experimental tank destroyer that mounts a powerful 3-inch anti-tank gun on the light M5 Stuart chassis, making it a tiny, fast vehicle carrying disproportionately heavy firepower."
 sp_chiha_tank:0 "Type 97 Chi-Ha - Bangalore Torpedo Launcher"
 sp_chiha_tank_desc:0 "A medium tank modified with side-mounted rocket launchers, giving it the unique ability to deliver explosive salvos for infantry support and obstacle clearing alongside its main armament."
 sp_dumay_tank:0 "Perinelle-Dumay Amphibious Tank"
 sp_dumay_tank_desc:0 "A colossal landship concept combining thick armor, multiple guns, and a unique amphibious drive to function as a moving fortress on both land and water."
 sp_pawel_tank:0 "Pawel Automobile Gun Carriage"
 sp_pawel_tank_desc:0 "A massive early landship design that relies on multiple fixed guns and thick armor to deliver overwhelming firepower and defensive strength at the cost of speed and flexibility."
 sp_jac_tank:0 "Jacquet Articulated Tank"
 sp_jac_tank_desc:0 "A multi-section, jointed hull design that allows greater mobility and trench-crossing ability than conventional single-hull tanks."
 sp_skoda_tank:0 "Skoda SK 13"
 sp_skoda_tank_desc:0 "An experimental half-track armored transport, made unique by its unusual coal-fired engine that set it apart from conventional fuel-powered vehicles."
 sp_motoguzzi_tank:0 "Motoguzzi Semovente da 65/17"
 sp_motoguzzi_tank_desc:0 "A light and mobile self-propelled gun that provides effective fire support even in mountainous terrain."
 sp_biemmi_tank:0 "Biemmi Naval Tank"
 sp_biemmi_tank_desc:0 "An amphibious vehicle with all-round tracks and a naval gun mount, giving it strong performance in water landings and reliable support during coastal assaults."
 sp_cul_tank:0 "Culqualber and Uolchefit Tank"
 sp_cul_tank_desc:0 "An improvised light vehicle named after Italian strongholds in East Africa, armed with machine guns and thin armor, best suited for cheap infantry support in colonial battles."
 sp_ksp_tank:0 "KSP-76"
 sp_ksp_tank_desc:0 "A fast wheeled self-propelled gun that delivers powerful anti-tank firepower at high speed but with minimal protection."
 sp_oka_tank:0 "2B1 Oka"
 sp_oka_tank_desc:0 "A colossal self-propelled artillery piece mounting a 420 mm gun, designed to deliver devastating long-range firepower from a super-heavy tracked platform."
 sp_cobra_tank:0 "Cobra LCCCV"
 sp_cobra_tank_desc:0 "A lightweight tracked command and combat vehicle that combines troop transport, strong communications, and fire support in a single platform."

 sp_natter_plane:0 "Bachem Ba 349 Natter"
 sp_natter_plane_desc:0 "A vertically launched, rocket-powered point-defense interceptor designed to fire a salvo of rockets into bomber formations, with a disposable airframe and recoverable pilot."
 sp_voss_plane:0 "Blohm und Voss Bv 141"
 sp_voss_plane_desc:0 "An asymmetrical reconnaissance aircraft whose offset cockpit provids superb visibility for observation and spotting missions."
 sp_whit_plane:0 "Armstrong Whitworth A.W.52"
 sp_whit_plane_desc:0 "An experimental flying wing aircraft designed to test advanced aerodynamics, offering exceptional lift and efficiency but plagued by stability issues."
 sp_north_plane:0 "Northtrop XB-35"
 sp_north_plane_desc:0 "An experimental intercontinental flying wing bomber, special for its enormous range and payload combined with a radical tailless design."
 sp_bel_plane:0 "Belyayev DB-LK"
 sp_bel_plane_desc:0 "An experimental long-range bomber, unique for its unusual twin-fuselage, dual-cockpit layout that aimed to improve stability and crew effectiveness."
